<!DOCTYPE html>
<!--
  计数器页面：只管展示，业务（计数状态与增量）全在 Python 侧的 CounterApi。
  版式照 msui README §3 的标准单列页骨架：**body 就是容器**——边距、内容
  列宽、垂直节奏全由 base.css 落在 body 上，不写一行版式 CSS；主角读数挂
  .display（成块居中、字号走 --font-display 档 48px、数字等宽不晃动）；
  按钮那张卡挂 .actions .center（横排 + 居中），同样不写自定义样式。
  颜色只经 var(--token) 取用，零手写色值（tests/test_style_gate.py 盯着）。
  tokens.css / base.css / tokens-light.css 不入仓、不手改——启动时由
  msui.resources.copy_assets 落进本目录（无条件覆盖，头部带 msui 版本横幅）。
  右上角的深 / 浅主题切换按钮是三个已发版小程序的统一写法：浅色全部颜色只来自
  msui 官方 tokens-light.css；按钮自己的定位写在 layout.css（入仓，只用新类名）。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Counter</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="tokens-light.css">
  <link rel="stylesheet" href="layout.css">
  <!-- 首帧前先应用已存的主题，免得浅色用户先闪一下深色（按钮文案在主脚本里再刷一次） -->
  <script>try { if (localStorage.getItem("msui-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
</head>
<body>
  <h1>计数器</h1>
  <p>点一下按钮，数字在 Python 侧累加，页面只负责显示。</p>
  <!-- 当前计数是本页主角：挂 .display 即得居中 48px 大读数，零自定义样式 -->
  <output class="display" id="count">…</output>
  <!-- .actions：按钮横排、间距走档；.center 让它对齐到主读数的正下方。
       两个类都来自 base.css，本页零版式 CSS 的规矩不破。 -->
  <div class="card actions center">
    <!-- 按钮文字「+N」由 JS 从后端状态里的 increment 推导，发新版只改 Python 常量 -->
    <button class="primary" id="add" disabled>+</button>
  </div>
  <small>业务在 Python、页面只管展示——msui js_api 桥的最小演示。</small>
  <!-- 深 / 浅主题切换：fixed 钉在右上角、不占文档流；图标是内联 svg（不用 Unicode / emoji） -->
  <button class="icon theme-toggle" id="theme-toggle" type="button" aria-label="切换到浅色" title="切换到浅色">
    <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
  <script>
    // 主题：存 localStorage 键 "msui-theme"，值 "light" 或缺省（深色）。
    const THEME_KEY = "msui-theme";
    function applyTheme(light) {
      const root = document.documentElement;
      if (light) root.dataset.theme = "light"; else delete root.dataset.theme;
      const btn = document.getElementById("theme-toggle");
      if (btn) {
        const label = light ? "切换到深色" : "切换到浅色";
        btn.setAttribute("aria-label", label); btn.title = label;
      }
    }
    try { applyTheme(localStorage.getItem(THEME_KEY) === "light"); } catch (e) { /* 无存储时就是深色 */ }
    document.getElementById("theme-toggle").addEventListener("click", () => {
      const light = document.documentElement.dataset.theme !== "light";
      applyTheme(light);
      try { if (light) localStorage.setItem(THEME_KEY, "light"); else localStorage.removeItem(THEME_KEY); } catch (e) {}
    });

    const countEl = document.getElementById("count");
    const addBtn = document.getElementById("add");

    function render(state) {
      countEl.textContent = String(state.count);
      addBtn.textContent = "+" + state.increment;
      addBtn.disabled = false;
    }

    // 应答是 msui.bridge.Serializer 的信封：busy=true 表示上一次点击还在
    // 处理中，本次就地丢弃（不排队），页面状态保持不变。
    async function call(name) {
      const reply = await window.pywebview.api[name]();
      if (reply.busy) return;
      render(reply.data);
    }

    addBtn.addEventListener("click", () => call("click"));
    // pywebviewready：js_api 注入完成的信号，之后才允许取初始状态
    window.addEventListener("pywebviewready", () => call("get_state"));
  </script>
</body>
</html>
