# 本仓是 MSToolbox 接入契约的官方样板——想接入的同事可以把这份文件当标准
# 答案照抄,只改成自己工具的值。字段含义见 MSToolbox 仓 docs/接入契约.md §3。

# 全局唯一、稳定、发布后不可改——客户端把它直接当缓存目录名用
# (%LocalAppData%\MSToolboxData\apps\<id>\<版本>\)。
# 字符集只能是小写字母、数字,以及作分隔用的连字符/下划线,不能以分隔符开头
# 结尾或连写,最长 64 字符;大写、空格、中文、点号、路径写法都不合规。
id = "counter"

# 业务用户在客户端列表里看到的中文显示名。样板仓的 name 里带「官方样板」
# 字样,让业务用户一眼认出这是示例工具而不是真实业务小程序。
name = "计数器(官方样板)"

# 三选一:gui(手动点开用) | etl(数据处理) | scheduled(定时任务)。
# 本工具是手动点开使用的纯 GUI 小程序,填 gui。
category = "gui"

# onedir 打包产物文件夹里要启动的 exe 文件名,必须与 build.py 实际产出的
# 文件名一致(本仓是 dist/Tool_Counter/Tool_Counter.exe)。
entry = "Tool_Counter.exe"

# 契约刻意不在本文件里写 icon / schedule ——这两个字段目前是死字段
# (契约 §3 已注明:写了也不会报错,但生成器不读、不会带进 catalog)。
# 等图标分发、定时调度这两件事各自设计定型后再补,现在写了纯属误导。
